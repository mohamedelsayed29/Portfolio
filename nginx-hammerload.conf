# Reference only.
# Copy this file manually to /etc/nginx/sites-available/hammerload on the server,
# then create a symlink in /etc/nginx/sites-enabled, run `nginx -t`, and reload
# Nginx with `systemctl reload nginx`.
#
# Nginx serves the hashed build assets straight from disk; everything else
# (pages, /api, /health) goes to the PM2-managed Node server on port 4000.

upstream hammerload_node {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name hammerload.com www.hammerload.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hammerload.com www.hammerload.com;

    ssl_certificate /etc/ssl/cloudflare/hammerload-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/hammerload-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Trust visitor IP headers only from Cloudflare's published proxy ranges.
    # Sources: https://www.cloudflare.com/ips-v4 and /ips-v6 (2026-10-09).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite output in /assets is content-hashed, so it can be cached forever.
    location /assets/ {
        root /var/www/hammerload/current/dist;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://hammerload_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
