# Install into /etc/nginx/conf.d/hammerload.conf (the active path on this server).
# Run scripts/install-nginx-security.sh to install the snippets and validate.
# These shared zones belong in the http context, where conf.d/*.conf is included.
limit_req_zone $binary_remote_addr zone=hammerload_site_ip:10m rate=30r/s;
limit_req_zone $server_name zone=hammerload_site_global:1m rate=100r/s;
limit_req_zone $binary_remote_addr zone=hammerload_booking_ip:10m rate=2r/m;
limit_req_zone $server_name zone=hammerload_booking_global:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=hammerload_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name hammerload.com www.hammerload.com;
    server_tokens off;
    root /var/www/hammerload;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location / {
        return 301 https://hammerload.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hammerload.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/hammerload.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hammerload.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://hammerload.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hammerload.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/hammerload.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hammerload.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Trust CF-Connecting-IP only when the TCP peer is a published Cloudflare IP.
    include /etc/nginx/snippets/hammerload-cloudflare.conf;
    limit_req zone=hammerload_site_ip burst=60 nodelay;
    limit_req zone=hammerload_site_global burst=200 nodelay;
    limit_req_status 429;
    limit_conn hammerload_connections 40;
    limit_conn_status 429;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/send-booking {
        include /etc/nginx/snippets/hammerload-booking.conf;
    }
    location = /api/bookings {
        include /etc/nginx/snippets/hammerload-booking.conf;
    }
    location ^~ /api/ {
        return 404;
    }
    location ^~ / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 20s;
    }
}
