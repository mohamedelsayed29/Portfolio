# Reference only.
# Copy this file manually to /etc/nginx/sites-available/hammerload on the server,
# then create a symlink in /etc/nginx/sites-enabled, run `nginx -t`, and reload
# Nginx with `systemctl reload nginx`.
#
# Update the proxy port if HOST_PORT is different from 4000 in docker-compose.

server {
    listen 80;
    listen [::]:80;
    server_name hammerload.com www.hammerload.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hammerload.com www.hammerload.com;

    ssl_certificate /etc/letsencrypt/live/hammerload.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hammerload.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
