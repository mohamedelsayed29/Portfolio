services:
  hammerload-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TURNSTILE_PUBLIC_SITE_ID: ${VITE_TURNSTILE_SITE_KEY:-}
    env_file:
      - .env.production
    environment:
      PORT: ${PORT:-4000}
      BOOKING_RATE_LIMIT_FILE: /app/security-state/booking-rates.json
    ports:
      - "127.0.0.1:${HOST_PORT:-4000}:${PORT:-4000}"
    volumes:
      - booking-security-state:/app/security-state
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 4000) + '/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  booking-security-state:
