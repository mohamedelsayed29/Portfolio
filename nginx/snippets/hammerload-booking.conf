# Included in both exact booking locations; other APIs are not exposed.
limit_req zone=hammerload_booking_ip burst=2 nodelay;
limit_req zone=hammerload_booking_global burst=10 nodelay;
limit_req_status 429;
limit_conn hammerload_connections 5;
client_max_body_size 16k;

proxy_pass http://127.0.0.1:4000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite caller-supplied chains. $remote_addr is verified by realip.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_connect_timeout 3s;
proxy_send_timeout 10s;
proxy_read_timeout 20s;
proxy_request_buffering on;
